name: rag-bancos

# Construcción compartida por los servicios que usan la imagen de la aplicación
x-app-build: &app-build
  context: .
  args:
    TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}

services:
  ollama:
    image: ollama/ollama:0.35.1
    container_name: rag-bancos-ollama
    restart: unless-stopped
    environment:
      # Una sola petición a la vez por modelo: el uso de memoria es predecible (la caché de
      # contexto crece con cada petición en paralelo) y los dos modelos permanecen cargados
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:0.35.1
    container_name: rag-bancos-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./docker/ollama-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    command: ["${LLM_MODEL:-llama3}", "${EMBEDDING_MODEL:-bge-m3}"]

  chroma:
    image: chromadb/chroma:0.5.20
    container_name: rag-bancos-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16
    container_name: rag-bancos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Indexa en ChromaDB los chunks de data/clean la primera vez (si el índice está vacío)
  bootstrap:
    build: *app-build
    image: rag-bancos-app:latest
    container_name: rag-bancos-bootstrap
    restart: "no"
    env_file: .env
    command: ["python", "scripts/ingest.py", "--index-only", "--if-empty"]
    depends_on:
      chroma:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data:ro

  # API y interfaz web: http://localhost:${APP_PORT:-8080}
  app:
    build: *app-build
    image: rag-bancos-app:latest
    container_name: rag-bancos-app
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "rag.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${APP_PORT:-8080}:8000"
    depends_on:
      chroma:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - hf_cache:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 120s

  # Herramientas de línea de comandos (ingesta, informes): docker compose run --rm ingest
  ingest:
    build: *app-build
    image: rag-bancos-app:latest
    container_name: rag-bancos-ingest
    profiles: ["tools"]
    env_file: .env
    depends_on:
      chroma:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - hf_cache:/models/huggingface

  # Pruebas unitarias dentro de Docker: docker compose run --rm tests
  tests:
    build:
      context: .
      target: dev
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    image: rag-bancos-tests:latest
    container_name: rag-bancos-tests
    profiles: ["tools"]
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      PYTHONPATH: /app/src
    depends_on:
      chroma:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
      - ./.env.example:/app/.env.example:ro
      - ./.env.gpu.example:/app/.env.gpu.example:ro

volumes:
  ollama_models:
  chroma_data:
  postgres_data:
  hf_cache:
