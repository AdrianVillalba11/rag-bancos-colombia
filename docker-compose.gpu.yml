# Activa la GPU NVIDIA (Ollama y reranker). Requiere NVIDIA Container Toolkit o Docker Desktop
# con WSL2. No se usa a mano: el perfil GPU (`cp .env.gpu.example .env`) ya configura
# COMPOSE_FILE, TORCH_INDEX y RERANKER_DEVICE para activarlo.
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  ollama:
    <<: *gpu
  app:
    <<: *gpu
  ingest:
    <<: *gpu
